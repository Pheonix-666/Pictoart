{% extends "base.html" %}

{% block title %}Admin Sign In - PICTOART{% endblock %}

{% block content %}
<div class="upload-page-bg">
  <div class="card" style="max-width: 420px;">
    <div class="brand-header">
      <div style="font-size: 2.2rem; font-weight: 800; color: #1e1b4b; margin-bottom: 0.25rem;">🔐 PICTOART</div>
      <div class="brand-title">Admin Portal</div>
      <div class="brand-subtitle">Vendor Staff Sign In</div>
    </div>

    {% if error_message %}
      <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Admin Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="admin@vendor.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">
        Sign In →
      </button>
    </form>
  </div>
</div>
{% endblock %}
